<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-kayori.png" />
    <link rel="apple-touch-icon" href="/logo-kayori.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AI-Kayori — v4.3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/gotham" rel="stylesheet">
    <style>
      html, body { background: #080808; margin: 0; overscroll-behavior: none; font-family: 'Gotham', 'Manrope', system-ui, sans-serif; font-weight: 500; }
      /* Gotham Medium bold - override */
      body, * { font-family: 'Gotham', 'Manrope', system-ui, sans-serif; }
      h1,h2,h3,b,strong,.font-bold { font-weight: 700 !important; font-family: 'Gotham', sans-serif; }
      .font-medium { font-weight: 500 !important; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }
      * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
      /* Liquid glass helpers */
      .glass { background: rgba(18,18,18,0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.06); }
      .glass-strong { background: rgba(12,12,12,0.85); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(255,255,255,0.08); }
      /* Remove white highlight on focus */
      textarea:focus, input:focus { outline: none !important; box-shadow: none !important; }
      *:focus { outline: none; }
      ::selection { background: rgba(255,255,255,0.15); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
